<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F4F1EC">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>trevl</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="stage">
    <aside class="side side-left" id="regie" aria-label="Regie für die Demo"></aside>

    <div class="device" id="device">
      <div class="statusbar" aria-hidden="true">
        <span id="clock">9:41</span>
        <span class="island"></span>
        <span class="sb-icons"><svg viewBox="0 0 18 12" width="18" height="12"><path d="M1 11h2V8H1zm4 0h2V6H5zm4 0h2V3.5H9zm4 0h2V1h-2z" fill="currentColor"/></svg><svg viewBox="0 0 26 12" width="26" height="12"><rect x="0.5" y="0.5" width="22" height="11" rx="3" fill="none" stroke="currentColor" opacity=".45"/><rect x="2" y="2" width="17" height="8" rx="1.6" fill="currentColor"/><rect x="23.5" y="4" width="2" height="4" rx="1" fill="currentColor" opacity=".45"/></svg></span>
      </div>
      <div class="push" id="push" role="alert" hidden></div>
      <main class="screen" id="screen"></main>
      <nav class="tabbar" id="tabbar" hidden></nav>
      <div class="sheet-wrap" id="sheetWrap" hidden>
        <div class="sheet-backdrop" data-action="close-sheet"></div>
        <section class="sheet" id="sheet" role="dialog" aria-modal="true"></section>
      </div>
      <div class="faceid" id="faceid" hidden>
        <div class="faceid-box">
          <svg viewBox="0 0 64 64" width="64" height="64" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 20V12a6 6 0 0 1 6-6h8M44 6h8a6 6 0 0 1 6 6v8M58 44v8a6 6 0 0 1-6 6h-8M20 58h-8a6 6 0 0 1-6-6v-8"/><path d="M22 24v5M42 24v5M32 26v11h-3M24 44c4.5 3.5 11.5 3.5 16 0" class="face"/></g></svg>
          <div class="faceid-text">Face ID</div>
        </div>
      </div>
      <div class="toast" id="toast" hidden></div>
    </div>

    <aside class="side side-right" id="wire" aria-label="Unter der Haube"></aside>
  </div>
  <script type="module" src="/app.js"></script>
</body>
</html>
